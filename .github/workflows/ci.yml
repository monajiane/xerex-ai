name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xerex
          POSTGRES_PASSWORD: xerex
          POSTGRES_DB: xerex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xerex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      XEREX_TEST_DATABASE_URL: postgresql+asyncpg://xerex:xerex@localhost:5432/xerex
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Check formatting
        run: ruff format --check app tests alembic
      - name: Tests (including migration round-trip on PostgreSQL)
        run: pytest -q

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    env:
      # `docker compose config` interpolates ${VAR:?} entries, so the required
      # deployment secrets must exist even though nothing is started here.
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      XEREX_SECRET_KEY: ci-only-secret-key-0123456789abcdefghijklmnop
      XEREX_CREDENTIALS_ENCRYPTION_KEY: J1F0Y2lKZk5Rb0x4b1J0VG5xU3lWMmNZRHR3UTdOMUU=
    steps:
      - uses: actions/checkout@v4
      - name: Validate the production compose file
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate the development override
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yaml config --quiet

  frontend:
    name: Frontend (lint + types + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (includes the i18n / no-hard-coded-strings guard)
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Tests (i18n parity, RTL guarantees, formatters, smoke)
        run: npm run test
      - name: Build
        run: npm run build
