# Xerex AI — reference deployment.
#
#   cp .env.example .env      # then edit the secrets
#   docker compose up --build
#
# Admin panel: http://localhost:8080  ·  API: http://localhost:8000/docs
name: xerex-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xerex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xerex}
      POSTGRES_DB: ${POSTGRES_DB:-xerex}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xerex}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      XEREX_ENVIRONMENT: ${XEREX_ENVIRONMENT:-production}
      XEREX_DEBUG: "false"
      XEREX_LOG_JSON: "true"
      XEREX_SECRET_KEY: ${XEREX_SECRET_KEY:?set XEREX_SECRET_KEY in .env}
      XEREX_CREDENTIALS_ENCRYPTION_KEY: ${XEREX_CREDENTIALS_ENCRYPTION_KEY:-}
      XEREX_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-xerex}:${POSTGRES_PASSWORD:-xerex}@postgres:5432/${POSTGRES_DB:-xerex}
      XEREX_REDIS_URL: redis://redis:6379/0
      XEREX_CORS_ORIGINS: ${XEREX_CORS_ORIGINS:-["http://localhost:8080"]}
      XEREX_DEFAULT_LOCALE: fa
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres-data:
